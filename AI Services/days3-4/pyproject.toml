[project]
name = "ai_support_api"
version = "0.1.0"
description = "Flask API over AWS managed AI services -- Comprehend and Translate, called via boto3."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.7",
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pillow>=10.0"
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_support_api*"]