[project]
name = "restock-validator"
version = "0.1.0"
description = "Warehouse restock manifest validator — Week 1 assignment reference solution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["restock_validator*"]
