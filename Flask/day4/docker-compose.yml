

# defining what containers we will need
services:
  # db service sets up database. has nothing to do with python app
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ticket_api

    # volumes: ways to store data outside of a container's own file system
    volumes:
      - db-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    # can tell if the database is actually running or not
    # we only want our app to start if the database is ready. NOT JUST IF THE CONTAINER IS READY
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # setting up our flask app
  api:
    build: .
    environment:
      # update URL to talk to db service, not localhost
      DATABASE_URL: postgresql+psycopg://postgres:root@db:5432/ticket_api
    ports:
      - "5000:5000"
    
    # api container won't start until db service passes its healthcheck
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: