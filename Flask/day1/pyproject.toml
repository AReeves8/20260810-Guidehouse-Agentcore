[project]
name= "ticket-api"
version = "0.1.0"
description = "RESRT API for support tickets"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ticket_api*"]