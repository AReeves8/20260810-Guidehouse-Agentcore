[project]
name = "ticket-assistant"
version = "0.1.0"
description = "A support-ticket assistant built on Amazon Bedrock's Converse API."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ticket_assistant*"]
